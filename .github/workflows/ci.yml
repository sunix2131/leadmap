name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pip-audit
      - run: pip-audit -r requirements.txt
      - run: python -m pytest -q tests
      - run: python -m compileall -q maps_parser

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadcrm
          POSTGRES_PASSWORD: test
          POSTGRES_DB: leadcrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadcrm -d leadcrm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web/backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://leadcrm:test@localhost:5432/leadcrm
      TEST_DATABASE_URL: postgresql+asyncpg://leadcrm:test@localhost:5432/leadcrm_test
      SECRET_KEY: 0123456789abcdef0123456789abcdef
      ADMIN_PASSWORD: correct-horse-battery-staple
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/backend/requirements.txt
      - run: pip install -r requirements.txt pytest pip-audit
      - run: pip-audit -r requirements.txt
      - run: python -m pytest -q
      - run: python -c "from app.main import app; assert app.title == 'LeadCRM'"
      - run: python -m compileall -q app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
